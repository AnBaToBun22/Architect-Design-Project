{% extends "layout.html" %}
{% set title = "Đăng nhập" %}

{% block content %}
<section class="login-shell">
  <form class="panel login-card" method="post">
    <h1>Nhận diện biển số xe</h1>
    <p>Đăng nhập để tiếp tục vào khu vực làm việc.</p>

    <label>
      Tên đăng nhập
      <input name="username" autocomplete="username" required>
    </label>

    <label>
      Mật khẩu
      <input name="password" type="password" autocomplete="current-password" required>
    </label>

    <button class="primary" type="submit">Đăng nhập</button>

    <div class="hint">
      Quản trị: admin / admin123<br>
      Cảnh sát: police01 / police123
    </div>
  </form>
</section>
{% endblock %}
